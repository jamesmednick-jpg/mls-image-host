server {
    listen 8080;
    root /usr/share/nginx/html;
    # Amazon fetches each URL once; browsers and CDNs may cache for a year.
    location ~* \.(png|jpe?g|webp)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /health { return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 404; }
}
